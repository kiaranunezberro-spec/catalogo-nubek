name: Publicar Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Comprobar conexión con Cloudflare
        shell: bash
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Falta configurar el secreto CLOUDFLARE_API_TOKEN en GitHub."
            exit 1
          fi
      - name: Instalar dependencias
        run: npm ci
      - name: Publicar Worker
        run: npm run deploy
      - name: Verificar catálogo público
        shell: bash
        run: |
          set -euo pipefail
          base="https://catalogo-nubek.kiaranunezberro.workers.dev"
          mkdir -p live-check
          for attempt in 1 2 3 4 5; do
            curl --fail --silent --show-error --location "$base/catalogo?version=20260727" -o live-check/catalogo.html || true
            if grep -q "nubek-enhancements.js" live-check/catalogo.html 2>/dev/null; then
              break
            fi
            sleep 5
          done
          curl --fail --silent --show-error --location "$base/nubek-enhancements.js?version=20260727" -o live-check/nubek-enhancements.js
          curl --fail --silent --show-error --location "$base/nubek-enhancements.css?version=20260727" -o live-check/nubek-enhancements.css
          curl --fail --silent --show-error --location "$base/api/weekly-discount?version=20260727" -o live-check/weekly-discount.json
          curl --fail --silent --show-error --location "$base/nubek-fixes/ceramica-20x20.webp" -o live-check/ceramica-20x20.webp
          curl --fail --silent --show-error --location "$base/nubek-fixes/jarra-cervecera-blanca.jpg" -o live-check/jarra-cervecera-blanca.jpg
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("live-check")
          html = (root / "catalogo.html").read_text(errors="replace")
          script = (root / "nubek-enhancements.js").read_text(errors="replace")
          css = (root / "nubek-enhancements.css").read_text(errors="replace")
          deal = json.loads((root / "weekly-discount.json").read_text())

          assert "nubek-enhancements.js" in html
          assert "Cajas para momentos importantes" in script
          assert "gris tornasol" in script.lower()
          assert "nubek-subcategory-showcase" in css

          candidate = deal.get("deal", deal)
          code = str(candidate.get("productCode", "")) if isinstance(candidate, dict) else ""
          descriptor = json.dumps(candidate, ensure_ascii=False).lower()
          assert code.startswith("NB-"), code
          assert "día de la madre" not in descriptor and "dia de la madre" not in descriptor
          assert (root / "ceramica-20x20.webp").stat().st_size > 5000
          assert (root / "jarra-cervecera-blanca.jpg").stat().st_size > 5000
          PY
