name: Validar Cloudflare Worker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Comprobar sintaxis
        run: |
          node --check src/index.js
          node --check src/catalog-enhancements.js
      - name: Validar compilación de Wrangler
        run: npm run check
      - name: Verificar catálogo público
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-check
          base="https://catalogo-nubek.kiaranunezberro.workers.dev"
          curl --fail --silent --show-error --location --retry 3 "$base/catalogo" -o live-check/catalogo.html
          curl --fail --silent --show-error --location --retry 3 "$base/nubek-enhancements.js" -o live-check/nubek-enhancements.js
          curl --fail --silent --show-error --location --retry 3 "$base/nubek-enhancements.css" -o live-check/nubek-enhancements.css
          curl --fail --silent --show-error --location --retry 3 "$base/api/weekly-discount" -o live-check/weekly-discount.json
          curl --fail --silent --show-error --location --retry 3 "$base/nubek-fixes/ceramica-20x20.webp" -o live-check/ceramica-20x20.webp
          curl --fail --silent --show-error --location --retry 3 "$base/nubek-fixes/jarra-cervecera-blanca.jpg" -o live-check/jarra-cervecera-blanca.jpg
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("live-check")
          html = (root / "catalogo.html").read_text(errors="replace")
          script = (root / "nubek-enhancements.js").read_text(errors="replace")
          css = (root / "nubek-enhancements.css").read_text(errors="replace")
          deal = json.loads((root / "weekly-discount.json").read_text())

          assert "nubek-enhancements.js" in html, "El catálogo público aún no carga las mejoras"
          assert "Cajas para momentos importantes" in script, "Falta el constructor de cajas"
          assert "gris tornasol" in script.lower(), "Falta la muestra de gris tornasol"
          assert "nubek-subcategory-showcase" in css, "Faltan los estilos de subcategorías"

          candidate = deal.get("deal", deal)
          code = str(candidate.get("productCode", "")) if isinstance(candidate, dict) else ""
          descriptor = json.dumps(candidate, ensure_ascii=False).lower()
          assert code.startswith("NB-"), f"El descuento semanal no pertenece al catálogo normal: {code}"
          assert "día de la madre" not in descriptor and "dia de la madre" not in descriptor, "El descuento semanal sigue siendo estacional"

          assert (root / "ceramica-20x20.webp").stat().st_size > 5000, "La imagen de cerámica no se descargó correctamente"
          assert (root / "jarra-cervecera-blanca.jpg").stat().st_size > 5000, "La imagen de jarra no se descargó correctamente"
          PY
      - name: Guardar evidencia pública
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nubek-live-check
          path: live-check
          if-no-files-found: warn
