name: Extraer endpoints Nubek

on:
  push:
    branches:
      - catalogo-correcciones-julio-2026

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[api]') && !contains(github.event.head_commit.message, '[snapshot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalogo-correcciones-julio-2026
      - name: Extraer endpoints
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, json, re
          path = glob.glob('site-snapshot/worker/assets/*CatalogClient*.js')[0]
          text = open(path, encoding='utf-8', errors='replace').read()
          endpoints = sorted(set(re.findall(r"/api/[A-Za-z0-9_?=&./{}$-]+", text)))
          contexts = []
          for term in ['weekly', 'deal', 'descuento', 'oferta', 'productCode']:
              start = 0
              while True:
                  pos = text.lower().find(term.lower(), start)
                  if pos < 0: break
                  contexts.append({'term': term, 'position': pos, 'snippet': text[max(0,pos-1000):pos+1600]})
                  start = pos + len(term)
                  if sum(1 for item in contexts if item['term'] == term) >= 20: break
          with open('site-snapshot/analysis/api-endpoints.json','w',encoding='utf-8') as f:
              json.dump({'endpoints': endpoints, 'contexts': contexts}, f, ensure_ascii=False, indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-snapshot/analysis/api-endpoints.json
          git commit -m "[api] Extraer endpoints del catálogo"
          git push origin HEAD:catalogo-correcciones-julio-2026
