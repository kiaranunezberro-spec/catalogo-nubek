name: Aplicar mejoras catálogo Nubek

on:
  push:
    branches:
      - agent/mejoras-catalogo-nubek

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mejoras-catalogo-nubek

      - name: Generar archivos del Worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src
          cat > /tmp/index.js.gz.b64 <<'B64INDEX'

B64INDEX

          cat > /tmp/catalog-enhancements.js.gz.b64 <<'B64ENH'

B64ENH

          base64 -d /tmp/index.js.gz.b64 | gunzip > src/index.js
          base64 -d /tmp/catalog-enhancements.js.gz.b64 | gunzip > src/catalog-enhancements.js
          python3 - <<'PY'
          from pathlib import Path
          path = Path('wrangler.jsonc')
          text = path.read_text()
          text = text.replace('"compatibility_date": "2026-07-21"', '"compatibility_date": "2026-07-27"')
          path.write_text(text)
          PY
          node --check src/index.js
          node --check src/catalog-enhancements.js

      - name: Guardar mejoras
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js src/catalog-enhancements.js wrangler.jsonc
          git commit -m "[generated] Mejorar catálogo normal, cajas, colores e imágenes"
          git push origin HEAD:agent/mejoras-catalogo-nubek
